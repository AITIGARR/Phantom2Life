name: Build Phantom2Life 1.3 (native sign blocks)
on:
  push:
    branches: [main, fix/native-sign-block-1-3-0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile
        run: gradle --no-daemon clean build
      - name: Package and verify
        run: |
          mkdir -p output
          cp build/libs/Phantom2Life-1.3.0.jar output/Phantom2Life-1.3.0.jar
          python3 - <<'PY'
          import zipfile, pathlib, json
          src=pathlib.Path('resource-pack')
          out=pathlib.Path('output/Phantom2Life-resource-pack-1.3.0.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(src.rglob('*')):
                  if f.is_file(): z.write(f,f.relative_to(src).as_posix())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert json.loads(z.read('pack.mcmeta'))['pack']['pack_format']==75
              assert 'assets/minecraft/textures/entity/signs/pale_oak.png' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Phantom2Life-1.3.0
          path: output/*
          if-no-files-found: error
