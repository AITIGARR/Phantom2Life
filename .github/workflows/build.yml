name: Build Phantom2Life Polymer 1.4
on:
  push:
    branches: [main, feature/polymer-native-sign-blocks]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace
      - name: Prepare mod and resource pack
        run: |
          mkdir -p output
          cp build/libs/Phantom2Life-1.4.0.jar output/Phantom2Life-1.4.0.jar
          python3 - <<'PY'
          import pathlib,zipfile,json
          root=pathlib.Path('resource-pack')
          out=pathlib.Path('output/Phantom2Life-resource-pack-1.4.0.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob('*')):
                  if path.is_file(): z.write(path,path.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert 'assets/minecraft/textures/entity/signs/pale_oak.png' in z.namelist()
              assert json.loads(z.read('pack.mcmeta'))['pack']['pack_format']==75
          with zipfile.ZipFile('output/Phantom2Life-1.4.0.jar') as z:
              assert z.testzip() is None
              assert 'ru/naviyosha/PhantomSignBlocks.class' in z.namelist()
              assert 'ru/naviyosha/PhantomSignBlocks$Standing.class' in z.namelist()
              assert 'ru/naviyosha/PhantomSignBlocks$Wall.class' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Phantom2Life-Polymer-1.4.0
          path: output/*
          if-no-files-found: error
